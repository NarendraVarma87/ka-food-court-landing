<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48" fill="none" aria-label="KA Food Court Logo">
  <defs>
    <linearGradient id="logoBadgeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <!-- Icon Badge -->
  <rect x="0" y="4" width="40" height="40" rx="12" fill="url(#logoBadgeDark)" />
  <text x="20" y="31" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#0A0A0B" text-anchor="middle" letter-spacing="-0.5">KA</text>
  <!-- Brand Text -->
  <text x="52" y="27" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" fill="#FFFFFF" letter-spacing="-0.5">KA FOOD COURT</text>
  <text x="53" y="39" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#A1A7B7" letter-spacing="1.8">CORPORATE FOOD SPACES</text>
</svg>
